PackageName: Satsuma
ShortDescription: محوّل ملفات بدون نقرات يعمل دون اتصال على ويندوز
Description: |-
  ساتسوما تطبيق مجاني مفتوح المصدر يعمل من شريط المهام ويحوّل الملفات ويعدّلها دون مغادرة مستكشف الملفات. ابدأ بسحب أي ملف أو مجلد، اضغط Shift أو Ctrl أو Alt، فتظهر عجلة تحت المؤشر: أفلت على أحد أقسامها لتحويل الصيغ (صور، صوت، فيديو، PDF، مستندات، عروض، جداول، ترجمات، أرشيفات) أو تشغيل أدوات الملفات (ضغط، قص، تقليم، دمج، تقسيم، تدوير، علامة مائية، تنقيح، بيانات وصفية وغيرها) أو إجراءات الملفات (مشاركة، نسخ، نقل، إعادة تسمية، تجزئة، إظهار، طرفية).
  كل شيء يعمل على جهازك. لا رفع للملفات ولا حسابات ولا تتبّع. متاح بالإنجليزية والصينية والهندية والإسبانية والعربية.
