ShortDescription: Zero-click, offline file converter for Windows
Description: |-
  Satsuma is a free, open-source tray app that converts and edits files without leaving File Explorer. Start dragging any file or folder, tap Shift, Ctrl or Alt, and a wheel opens under the cursor: drop on a wedge to convert formats (images, audio, video, PDF, documents, slides, spreadsheets, subtitles, archives), run file tools (compress, crop, trim, merge, split, rotate, watermark, redact, metadata, and more) or file actions (share, copy, move, rename, hash, reveal, terminal).
  Everything runs on your PC. No uploads, no accounts, no telemetry. Available in English, Chinese, Hindi, Spanish and Arabic.
